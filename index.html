<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🧩 jigsaw puzzle 🧩</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #ffffff;
    margin: 0;
    padding: 20px;
  }
  h1 { color: #333; }
  #controls { margin-bottom: 20px; }
  canvas { border: 2px solid #4ef706; cursor: grab; }
  #gameContainer { display: flex; flex-direction: column; align-items: center; }
  #message { font-size: 1.2em; color: rgb(249, 51, 6); margin-top: 15px; font-weight: bold; }
</style>
</head>
<body>
<h1>🧩 JIGSAW PUZZLE 🧩</h1>

<div id="controls">
  <input type="file" id="imageUpload" accept="image/*" />
  <select id="difficulty">
    <option value="5">5 pieces</option>
    <option value="20">20 pieces</option>
    <option value="40">40 pieces</option>
    <option value="80">80 pieces</option>
    <option value="100">100 pieces</option>
  </select>
  <button id="startPuzzle">Start Puzzle</button>
</div>

<div id="gameContainer">
  <div id="message"></div>
  <canvas id="puzzleCanvas" width="1000" height="600"></canvas>
  
</div>

<script>
const canvas = document.getElementById('puzzleCanvas');
const ctx = canvas.getContext('2d');
const msg = document.getElementById('message');
const fileInput = document.getElementById('imageUpload');

let image = new Image();
let pieces = [];
let rows, cols;
let pieceW, pieceH;
let dragging = null;
let offsetX, offsetY;
let completedPieces = 0;
let targetX, targetY, targetW, targetH; // assembly area

// Load uploaded image
fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = ev => image.src = ev.target.result;
    reader.readAsDataURL(file);
  }
});

// Start puzzle
document.getElementById('startPuzzle').addEventListener('click', () => {
  if (!image.src) return alert('Upload an image first!');
  msg.textContent = '';
  const diff = parseInt(document.getElementById('difficulty').value);
  startPuzzle(diff);
});

function startPuzzle(diff) {
  rows = Math.floor(Math.sqrt(diff));
  cols = Math.ceil(diff / rows);

  // Fit image to canvas
  const scale = Math.min(800 / image.width, 500 / image.height);
  const w = image.width * scale;
  const h = image.height * scale;

  pieceW = w / cols;
  pieceH = h / rows;

  canvas.width = 1000;                  //change box here (later)
  canvas.height = 600;

  // Assembly area in center
  targetW = w;
  targetH = h;
  targetX = (canvas.width - w) / 2;
  targetY = (canvas.height - h) / 2;

  pieces = [];
  completedPieces = 0;

  // Create puzzle pieces
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      pieces.push({
        sx: x * (image.width / cols),
        sy: y * (image.height / rows),
        sw: image.width / cols,
        sh: image.height / rows,
        x: Math.random() * (canvas.width - pieceW),
        y: Math.random() * (canvas.height - pieceH),
        correctX: targetX + x * pieceW,
        correctY: targetY + y * pieceH,
        placed: false
      });
    }
  }

  drawPuzzle();
}

function drawPuzzle() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // draw assembly area
  ctx.fillStyle = 'rgba(0, 150, 255, 0.2)';                 //transparent light blue area wher to fix pieces
  ctx.fillRect(targetX, targetY, targetW, targetH);
  ctx.strokeStyle = 'rgba(0, 150, 255, 0.5)';
  ctx.strokeRect(targetX, targetY, targetW, targetH);

  // Draw pieces
  for (const p of pieces) {
    ctx.drawImage(image, p.sx, p.sy, p.sw, p.sh, p.x, p.y, pieceW, pieceH);

    if (!p.placed) {
      ctx.strokeStyle = "#aaa";
      ctx.strokeRect(p.x, p.y, pieceW, pieceH);
    }
  }
}

canvas.addEventListener('mousedown', e => {
  const mx = e.offsetX, my = e.offsetY;
  for (let i = pieces.length - 1; i >= 0; i--) {
    const p = pieces[i];
    if (!p.placed && mx > p.x && mx < p.x + pieceW && my > p.y && my < p.y + pieceH) {
      dragging = p;
      offsetX = mx - p.x;
      offsetY = my - p.y;
      pieces.push(pieces.splice(i, 1)[0]); // bring to front
      break;
    }
  }
});

canvas.addEventListener('mousemove', e => {
  if (dragging) {
    dragging.x = e.offsetX - offsetX;
    dragging.y = e.offsetY - offsetY;
    drawPuzzle();
  }
});

canvas.addEventListener('mouseup', () => {
  if (dragging) {
    // Snap if close
    if (Math.abs(dragging.x - dragging.correctX) < 40 &&       //snaping distance
        Math.abs(dragging.y - dragging.correctY) < 40) {
      dragging.x = dragging.correctX;
      dragging.y = dragging.correctY;
      dragging.placed = true;
      completedPieces++;
      if (completedPieces === pieces.length) {
        msg.textContent = "Puzzle completed! ";
      }
    }
    dragging = null;
    drawPuzzle();
  }
});
function trackUserInteraction() {
  // Track page view
  console.log(`[Page View] URL: ${window.location.href}, Timestamp: ${new Date().toISOString()}`);

  // Track clicks on any element
  document.addEventListener('click', event => {
    const target = event.target;
    console.log(`[Click Event] Tag: ${target.tagName}, ID: ${target.id || 'N/A'}, Class: ${target.className || 'N/A'}, Text: "${target.innerText.trim()}", Timestamp: ${new Date().toISOString()}`);
  });
}

// Call the function on page load
window.addEventListener('load', trackUserInteraction);

</script>
</body>
</html>
